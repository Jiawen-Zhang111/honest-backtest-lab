[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "honest-backtest-lab"
version = "0.1.0"
description = "A ruler, not a prophecy: measure whether a backtest is lying to you (survivorship, hidden sector bets, multiple testing)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
data = ["yfinance>=0.2.50"]
test = ["pytest"]

[tool.setuptools]
packages = ["honestlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
